name: Publish ICS to GitHub Pages

on:
  schedule:
    # every 6 hours — keeps the subscribed calendar reasonably fresh
    - cron: "23 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug obfuscation font (temporary)
        run: |
          pip install fonttools
          python - <<'EOF'
          import json, re, urllib.request
          from fontTools.ttLib import TTFont
          import io
          url = "https://next.fussball.de/widget/team-matches/1e84054a-be7f-4225-ae66-73bcc81e1528"
          req = urllib.request.Request(url, headers={"Referer": "https://fortunapankow46ev.de/"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8")
          data = json.loads(re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', html, re.S).group(1))
          pp = data["props"]["pageProps"]
          fid = pp["obfuscatedFont"]
          print("fontid:", fid)
          m = pp["previousMatches"][0]
          print("sample date codepoints:", [hex(ord(c)) for c in m["kickoff"]["date"]])
          for fmt in ("woff", "ttf"):
              furl = f"https://www.fussball.de/export.fontface/-/format/{fmt}/id/{fid}/type/font"
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(furl, headers={"Referer":"https://fortunapankow46ev.de/"}), timeout=30).read()
              except Exception as e:
                  print(fmt, "ERR", e); continue
              print(fmt, "bytes", len(raw))
              try:
                  f = TTFont(io.BytesIO(raw))
              except Exception as e:
                  print(fmt, "parse ERR", e); continue
              cmap = f.getBestCmap()
              print("glyphOrder sample:", f.getGlyphOrder()[:20])
              items = list(cmap.items())[:15]
              print("cmap sample:", [(hex(k), v) for k, v in items])
              break
          EOF

      - name: Fetch fixtures and build site
        run: |
          python export_fixtures.py --out-dir out
          mkdir -p _site
          cp pages/index.html _site/
          cp out/fixtures.ics out/fixtures.json out/fixtures.csv _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
