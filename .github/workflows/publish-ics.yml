name: Publish ICS to GitHub Pages

on:
  schedule:
    # every 6 hours — keeps the subscribed calendar reasonably fresh
    - cron: "23 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug __NEXT_DATA__ (temporary)
        run: |
          python - <<'EOF'
          import json, re, urllib.request
          url = "https://next.fussball.de/widget/team-matches/1e84054a-be7f-4225-ae66-73bcc81e1528"
          html = urllib.request.urlopen(url, timeout=30).read().decode("utf-8")
          m = re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', html, re.S)
          data = json.loads(m.group(1))
          pp = data["props"]["pageProps"]
          print("pageProps keys:", list(pp.keys()))
          pp.pop("translations", None)
          out = json.dumps(pp, ensure_ascii=False, indent=1)
          print(out[:40000])
          EOF

      - name: Fetch fixtures and build site
        run: |
          python export_fixtures.py --out-dir out
          mkdir -p _site
          cp pages/index.html _site/
          cp out/fixtures.ics out/fixtures.json out/fixtures.csv _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
