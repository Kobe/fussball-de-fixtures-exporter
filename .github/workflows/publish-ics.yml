name: Publish ICS to GitHub Pages

on:
  schedule:
    # every 6 hours — keeps the subscribed calendar reasonably fresh
    - cron: "23 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe match detail for venue (temporary)
        run: |
          python - <<'EOF'
          import json, re, requests
          ref = "https://fortunapankow46ev.de/"
          H = {"User-Agent": "Mozilla/5.0", "Referer": ref}
          rx = re.compile(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', re.S)
          s = requests.Session()
          w = s.get("https://next.fussball.de/widget/team-matches/1e84054a-be7f-4225-ae66-73bcc81e1528", headers=H, timeout=30)
          pp = json.loads(rx.search(w.text).group(1))["props"]["pageProps"]
          mid = (pp.get("nextMatches") or pp.get("previousMatches"))[0]["id"]
          print("match id:", mid)
          candidates = [
            f"https://next.fussball.de/spiel/{mid}",
            f"https://next.fussball.de/spiel/{mid}/uebersicht",
            f"https://next.fussball.de/widget/match/{mid}",
            f"https://next.fussball.de/widget/match-overview/{mid}",
          ]
          for url in candidates:
              try:
                  r = s.get(url, headers=H, timeout=30, allow_redirects=True)
              except Exception as e:
                  print(url, "ERR", e); continue
              m = rx.search(r.text)
              print("\n===", url, "HTTP", r.status_code, "next_data" if m else "no_next_data", "final", r.url)
              if not m:
                  continue
              d = json.loads(m.group(1))["props"]["pageProps"]
              keys = [k for k in d if k != "translations"]
              print("keys:", keys)
              blob = json.dumps(d, ensure_ascii=False)
              for kw in ("venue", "Spielst", "stadi", "address", "Adresse", "street", "Straße", "geo", "latitude", "plz", "zip", "city", "Ort"):
                  i = blob.lower().find(kw.lower())
                  if i >= 0:
                      print(f"  [{kw}] ...{blob[max(0,i-40):i+120]}...")
          EOF

      - name: Fetch fixtures and build site
        run: |
          python export_fixtures.py --out-dir out
          mkdir -p _site
          cp pages/index.html _site/
          cp out/fixtures.ics out/fixtures.json out/fixtures.csv _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
